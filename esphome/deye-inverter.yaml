# Deye SUN-6K-SG05LP1  →  RS485 (M5Stack, SP485EEN)  →  ESP32  →  ESPHome web_server v3 + dashboard
#
# Mapa de registos: Deye Modbus protocol V118, híbrido monofásico SG0*LP1
# (o mesmo usado pelo ha-solarman em deye_hybrid.yaml).
# Convenções de sinal do Deye: bateria + = descarga / − = carga; rede + = compra / − = venda.
#
# Os nomes das entidades são usados pelo dashboard (deye-dashboard.js).
# Se mudares um nome, muda também em CFG.sensors (ver README).

substitutions:
  name: deye-inverter
  friendly_name: Deye Inverter
  # Versão do dashboard servida pelo jsDelivr: "main" ou uma tag (ex.: v1.0.0, recomendado)
  dash_version: main

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# O Modbus usa a UART2 (GPIO16/17): a UART0/USB fica livre para logs.
logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

# Atualizações encriptadas com a chave da API
ota:
  - platform: esphome
    encryption: {}

wifi:
  networks:
    - ssid: !secret wifi_ssid_1
      password: !secret wifi_password_1
    - ssid: !secret wifi_ssid_2
      password: !secret wifi_password_2
  ap:
    ssid: "Deye Inverter Fallback"
    password: !secret fallback_password

captive_portal:

web_server:
  port: 80
  version: 3
  css_url: https://cdn.jsdelivr.net/gh/DanielSilva-Shelly/DeyeWebServer@${dash_version}/deye-dashboard.css
  js_url: https://cdn.jsdelivr.net/gh/DanielSilva-Shelly/DeyeWebServer@${dash_version}/deye-dashboard.js
  # Sem upload de firmware pelo browser (endpoint em claro); usa o OTA encriptado acima.
  # Nota: o captive_portal (só ativo no AP de recurso) continua a aceitar upload.
  ota: false
  auth:
    type: digest
    username: admin
    password: !secret web_password
  sorting_groups:
    - id: solar
      name: Solar
      sorting_weight: 1
    - id: bateria
      name: Bateria
      sorting_weight: 2
    - id: rede
      name: Rede Elétrica
      sorting_weight: 3
    - id: casa
      name: Casa
      sorting_weight: 4
    - id: sistema
      name: Sistema
      sorting_weight: 5

uart:
  id: uart_bus
  tx_pin: GPIO17 # → DI do módulo RS485
  rx_pin: GPIO16 # ← RO do módulo RS485
  baud_rate: 9600
  stop_bits: 1

modbus:
  id: modbus_bus
  uart_id: uart_bus

modbus_controller:
  # Potências e SOC: o que o dashboard anima em tempo real
  - id: deye
    address: 1
    modbus_id: modbus_bus
    update_interval: 10s
  # Energias, tensões, temperaturas e estado mudam devagar: poupa o barramento
  - id: deye_lento
    address: 1
    modbus_id: modbus_bus
    update_interval: 60s

# Modelos reutilizados pelos sensores abaixo (chaves com "." são ignoradas pelo ESPHome)
.power: &power
  platform: modbus_controller
  modbus_controller_id: deye
  register_type: holding
  unit_of_measurement: W
  device_class: power
  state_class: measurement
  accuracy_decimals: 0

.energy: &energy
  platform: modbus_controller
  modbus_controller_id: deye_lento
  register_type: holding
  value_type: U_WORD
  unit_of_measurement: kWh
  device_class: energy
  state_class: total_increasing
  accuracy_decimals: 1
  filters:
    - multiply: 0.1

.slow: &slow
  platform: modbus_controller
  modbus_controller_id: deye_lento
  register_type: holding
  state_class: measurement

sensor:
  # ---------- Tempo real (10 s) ----------
  - <<: *power
    name: "Produção PV1"
    icon: mdi:solar-power
    address: 186
    value_type: U_WORD
    web_server: { sorting_group_id: solar, sorting_weight: 1 }

  - <<: *power
    name: "Produção PV2"
    icon: mdi:solar-power
    address: 187
    value_type: U_WORD
    web_server: { sorting_group_id: solar, sorting_weight: 2 }

  - platform: modbus_controller
    modbus_controller_id: deye
    id: bateria_soc
    name: "Nível da Bateria"
    register_type: holding
    address: 184
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    web_server: { sorting_group_id: bateria, sorting_weight: 1 }

  - <<: *power
    name: "Potência da Bateria" # + descarga / − carga
    icon: mdi:battery-charging
    address: 190
    value_type: S_WORD
    web_server: { sorting_group_id: bateria, sorting_weight: 2 }

  - <<: *power
    name: "Potência da Rede" # + compra / − venda
    icon: mdi:transmission-tower
    address: 169
    value_type: S_WORD
    web_server: { sorting_group_id: rede, sorting_weight: 1 }

  - <<: *power
    name: "Consumo da Casa"
    icon: mdi:home-lightning-bolt
    address: 178
    value_type: S_WORD
    web_server: { sorting_group_id: casa, sorting_weight: 1 }

  # ---------- Energia de hoje (60 s; o inversor faz reset à meia-noite) ----------
  - <<: *energy
    name: "Produção Solar Hoje"
    address: 108
    web_server: { sorting_group_id: solar, sorting_weight: 3 }

  - <<: *energy
    name: "Carga da Bateria Hoje"
    address: 70
    web_server: { sorting_group_id: bateria, sorting_weight: 3 }

  - <<: *energy
    name: "Descarga da Bateria Hoje"
    address: 71
    web_server: { sorting_group_id: bateria, sorting_weight: 4 }

  - <<: *energy
    name: "Energia Comprada Hoje"
    address: 76
    web_server: { sorting_group_id: rede, sorting_weight: 2 }

  - <<: *energy
    name: "Energia Vendida Hoje"
    address: 77
    web_server: { sorting_group_id: rede, sorting_weight: 3 }

  - <<: *energy
    name: "Consumo Hoje"
    address: 84
    web_server: { sorting_group_id: casa, sorting_weight: 2 }

  # Total acumulado (32 bits, palavra baixa primeiro): útil para o painel de Energia do Home Assistant
  - platform: modbus_controller
    modbus_controller_id: deye_lento
    name: "Produção Solar Total"
    register_type: holding
    address: 96
    value_type: U_DWORD_R
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    web_server: { sorting_group_id: solar, sorting_weight: 4 }

  # ---------- Rede, bateria e inversor (60 s) ----------
  - <<: *slow
    name: "Tensão da Rede"
    address: 150
    value_type: U_WORD
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    web_server: { sorting_group_id: rede, sorting_weight: 4 }

  - <<: *slow
    name: "Frequência da Rede"
    address: 79
    value_type: U_WORD
    unit_of_measurement: Hz
    device_class: frequency
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    web_server: { sorting_group_id: rede, sorting_weight: 5 }

  - <<: *slow
    name: "Tensão da Bateria"
    address: 183
    value_type: U_WORD
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    web_server: { sorting_group_id: bateria, sorting_weight: 5 }

  - <<: *slow
    name: "Temperatura da Bateria"
    address: 182
    value_type: U_WORD
    unit_of_measurement: °C
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - offset: -1000
      - multiply: 0.1
    web_server: { sorting_group_id: bateria, sorting_weight: 6 }

  - <<: *slow
    name: "Temperatura DC do Inversor"
    address: 90
    value_type: S_WORD
    unit_of_measurement: °C
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - offset: -1000
      - multiply: 0.1
    web_server: { sorting_group_id: sistema, sorting_weight: 3 }

  - <<: *slow
    name: "Temperatura AC do Inversor"
    address: 91
    value_type: S_WORD
    unit_of_measurement: °C
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - offset: -1000
      - multiply: 0.1
    web_server: { sorting_group_id: sistema, sorting_weight: 4 }

  - <<: *slow
    name: "Tensão PV1"
    address: 109
    value_type: U_WORD
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 0
    filters:
      - multiply: 0.1
    web_server: { sorting_group_id: solar, sorting_weight: 5 }

  - <<: *slow
    name: "Tensão PV2"
    address: 111
    value_type: U_WORD
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 0
    filters:
      - multiply: 0.1
    web_server: { sorting_group_id: solar, sorting_weight: 6 }

  # Código de estado bruto → texto em "Estado do Inversor"
  - platform: modbus_controller
    modbus_controller_id: deye_lento
    id: estado_raw
    internal: true
    register_type: holding
    address: 59
    value_type: U_WORD
    on_value:
      - text_sensor.template.publish:
          id: estado_inversor
          state: !lambda |-
            switch ((int) x) {
              case 0: return std::string("Standby");
              case 1: return std::string("Autoteste");
              case 2: return std::string("Normal");
              case 3: return std::string("Alarme");
              case 4: return std::string("Falha");
              default: return std::string("Desconhecido");
            }

  # ---------- Diagnóstico do ESP ----------
  - platform: wifi_signal
    name: "Sinal WiFi"
    update_interval: 60s
    entity_category: diagnostic
    web_server: { sorting_group_id: sistema, sorting_weight: 10 }

  - platform: uptime
    name: "Tempo Ligado"
    update_interval: 60s
    entity_category: diagnostic
    web_server: { sorting_group_id: sistema, sorting_weight: 11 }

text_sensor:
  - platform: template
    id: estado_inversor
    name: "Estado do Inversor"
    icon: mdi:information-outline
    web_server: { sorting_group_id: sistema, sorting_weight: 1 }

binary_sensor:
  # Falso quando o inversor deixa de responder (cabo, A/B trocados, endereço errado…)
  - platform: template
    name: "Ligação ao Inversor"
    device_class: connectivity
    lambda: |-
      return !id(deye).get_module_offline() && !std::isnan(id(bateria_soc).state);
    web_server: { sorting_group_id: sistema, sorting_weight: 2 }

button:
  - platform: restart
    name: "Reiniciar ESP"
    web_server: { sorting_group_id: sistema, sorting_weight: 20 }
